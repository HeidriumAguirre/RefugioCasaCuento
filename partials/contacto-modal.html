<div class="contacto-modal-combinada" id="contactoModalCombinada" role="dialog" aria-modal="true" aria-labelledby="contactoModalTitleCombinada">
  <div class="contacto-modal-content-combinada">
    <button class="contacto-modal-close-combinada" id="contactoModalCloseCombinada" aria-label="Cerrar">✕</button>
    <h3 class="contacto-modal-title-combinada" id="contactoModalTitleCombinada">Contáctanos</h3>
    <p class="contacto-modal-subtitle-combinada">Envíanos un mensaje y te responderemos a la brevedad.</p>
    <form id="contactoFormCombinada" class="contacto-form-combinada" novalidate>
      <div class="form-group-combinada">
        <label for="combinada-nombre">Nombre *</label>
        <input type="text" name="nombre" id="combinada-nombre" required placeholder="Tu nombre completo" />
      </div>
      <div class="form-group-combinada">
        <label for="combinada-asunto">Asunto *</label>
        <input type="text" name="asunto" id="combinada-asunto" required placeholder="Motivo de tu consulta" />
      </div>
      <div class="form-group-combinada">
        <label for="combinada-correo">Correo *</label>
        <input type="email" name="correo" id="combinada-correo" required placeholder="tu@email.com" />
      </div>
      <div class="form-group-combinada">
        <label for="combinada-mensaje">Mensaje *</label>
        <textarea name="mensaje" id="combinada-mensaje" rows="5" required placeholder="Cuéntanos en qué podemos ayudarte..."></textarea>
      </div>
      <button type="submit" class="contacto-modal-btn-combinada">Enviar Mensaje</button>
      <p class="contacto-modal-note-combinada" id="contactoModalNoteCombinada" style="display:none;"></p>
    </form>
  </div>
</div>
