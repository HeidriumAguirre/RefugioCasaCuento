<div class="floating-settings" id="floatingSettings" role="region" aria-label="Ajustes de visualizacion">
  <div class="floating-settings-inner">
    <div class="font-size-control" role="group" aria-label="Tamano del texto">
      <button type="button" class="font-btn font-btn-minus" id="fontBtnMinus" aria-label="Reducir tamano del texto">A&minus;</button>
      <input type="range" class="font-slider" id="fontSlider" min="0.85" max="1.6" step="0.05" value="1" aria-label="Tamano del texto" />
      <button type="button" class="font-btn font-btn-plus" id="fontBtnPlus" aria-label="Aumentar tamano del texto">A+</button>
      <span class="font-size-value" id="fontSizeValue">100%</span>
    </div>

    <div class="lang-control" id="langControl">
      <button type="button" class="lang-btn" aria-label="Cambiar idioma" aria-expanded="false" aria-haspopup="true">

      </button>
      <ul class="lang-menu" role="menu">
        <li role="none"><a href="#" role="menuitem" data-lang="es">Espanol</a></li>
        <li role="none"><a href="#" role="menuitem" data-lang="en">English</a></li>
        <li role="none"><a href="#" role="menuitem" data-lang="pt">Portugues</a></li>
      </ul>
    </div>
  </div>
</div>
