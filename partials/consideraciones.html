<!--
  partials/consideraciones.html
  Modal flotante (banner inferior) con las consideraciones de la casa.
  Aparece automaticamente al cargar la pagina; el usuario puede cerrarlo
  y la eleccion se guarda en localStorage para no volver a mostrarlo.
-->
<div class="consideraciones-flotante" id="consideracionesFlotante" data-consideraciones>
  <div class="consideraciones-contenido">
    <button type="button" class="consideraciones-cerrar" aria-label="Cerrar aviso" data-consideraciones-cerrar>&times;</button>
    <div class="consideraciones-titulo">Antes de reservar, considera</div>
    <ul class="consideraciones-lista">
      <li>Cada espacio esta pensado para parejas y grupos tranquilos. <strong>No es ideal para familias con niños pequenos</strong> por las estructuras del lugar.</li>
      <li><strong>No se admiten animales</strong> en el hostal, sus jardines ni sus espacios comunes.</li>
    </ul>
    <label class="consideraciones-no-mostrar">
      <input type="checkbox" data-consideraciones-nomostrar /> No volver a mostrar
    </label>
  </div>
</div>
